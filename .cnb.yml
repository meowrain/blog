# 推送到 main：构建静态站点并部署到 EdgeOne Makers 项目 blog-learn。
# EDGEONE_API_TOKEN 存放在私有密钥仓库 meowyyds/blog-envs 的 envs.yml 中。
main:
  push:
    - imports: https://cnb.cool/meowyyds/blog-envs/-/blob/main/envs.yml
      # 不传目录：让 CLI 自己 install / build .edgeone（静态资源 + cloud-functions + agents）
      # 再整体上传；直接传 ./dist 只会传静态文件，云函数会丢。
      stages:
        - name: Build and Deploy
          image: node:20
          script:
            - npm i -g pnpm@9.14.4
            - npx --yes edgeone makers deploy -n blog-learn -t "$EDGEONE_API_TOKEN" --json

# NPC 事件流水线：@ 提及 NPC 时，由 npc:go 执行任务。
# 角色定义见 .cnb/settings.yml；这里只固定运行模型。
#
# 注意：issue.comment@npc 与 pull_request.comment@npc 需分别配置，
# 平台按事件独立合并，只配一个则另一个仍走系统默认。
$:
  issue.comment@npc:
    - docker:
        image: cnbcool/default-npc:latest
      stages:
        - name: npc go
          type: npc:go
          options:
            model: deepseek-v4.1-flash

  pull_request.comment@npc:
    - docker:
        image: cnbcool/default-npc:latest
      stages:
        - name: npc go
          type: npc:go
          options:
            model: deepseek-v4.1-flash
