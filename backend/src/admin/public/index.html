<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Admin</title>
    <script>try { document.documentElement.dataset.theme = localStorage.getItem('admin:theme') || 'light'; } catch { /* storage may be unavailable */ }</script>
    <link rel="stylesheet" href="https://fastly.jsdelivr.net/npm/daisyui@5/daisyui.css">
    <script src="https://fastly.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css">
    <link rel="stylesheet" href="styles.css?v=20261011-5">
</head>
<body>
    <div class="app" id="app">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo-mark">B</div>
                <div class="sidebar-brand">
                    <h1>Blog Admin</h1>
                    <p class="sidebar-sub">内容管理控制台</p>
                </div>
            </div>
            <button type="button" class="sidebar-compose" id="sidebar-new-post">
                <svg class="size-4 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
                <span>写文章</span>
            </button>
            <nav class="sidebar-nav">
                <p class="nav-heading">内容</p>
                <button class="nav-item active" data-view="articles">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></svg>
                    <span>文章</span>
                </button>
                <button class="nav-item" data-view="categories">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
                    <span>分类目录</span>
                </button>
                <button class="nav-item" data-view="tags">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/><circle cx="7.5" cy="7.5" r=".5" fill="currentColor"/></svg>
                    <span>标签</span>
                </button>
                <p class="nav-heading">系统</p>
                <button class="nav-item" data-view="backups">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M12 7v5l3 3"/></svg>
                    <span>备份</span>
                </button>
            </nav>
            <div class="sidebar-footer">
                <button id="refresh-btn" class="btn btn-ghost btn-sm btn-block justify-start">
                    <svg class="size-4 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
                    刷新数据
                </button>
            </div>
        </aside>

        <div class="main-wrapper">
            <!-- Top bar -->
            <header class="topbar">
                <button type="button" class="icon-btn" id="sidebar-toggle" aria-label="收起侧边栏" title="收起侧边栏">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18"/><path d="M3 6h18"/><path d="M3 18h18"/></svg>
                </button>
                <nav class="breadcrumb" id="breadcrumb" aria-label="breadcrumb"></nav>
                <div class="topbar-actions">
                    <a class="icon-btn" href="/" target="_blank" rel="noreferrer" title="访问站点">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18Z"/></svg>
                    </a>
                    <button type="button" class="icon-btn" id="theme-toggle" title="切换主题">
                        <svg class="theme-icon-light" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
                        <svg class="theme-icon-dark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
                    </button>
                    <div class="avatar-chip" title="管理员"><span>B</span></div>
                </div>
            </header>

            <!-- Main Content -->
            <main class="main-content" id="main-content">
                <!-- Articles View -->
                <div id="articles-view" class="view active">
                    <div class="view-header">
                        <div>
                            <h2>文章管理</h2>
                            <p class="view-summary" id="articles-summary"></p>
                        </div>
                        <div class="actions">
                            <button id="batch-mode-btn" class="btn btn-outline btn-sm">批量管理</button>
                            <button id="new-article-btn" class="btn btn-primary btn-sm">
                                <svg class="size-4 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                                新建文章
                            </button>
                        </div>
                    </div>

                    <!-- Batch Toolbar -->
                    <div id="batch-toolbar" class="batch-toolbar" hidden>
                        <label class="label cursor-pointer gap-2 text-sm">
                            <input id="batch-select-all" type="checkbox" class="checkbox checkbox-sm checkbox-primary">
                            全选本页
                        </label>
                        <span id="batch-count" class="badge badge-primary badge-soft">已选 0 篇</span>
                        <div class="batch-toolbar-actions">
                            <button id="batch-clear-btn" class="btn btn-ghost btn-xs">取消选择</button>
                            <button id="batch-publish-btn" class="btn btn-success btn-soft btn-xs" disabled>发布</button>
                            <button id="batch-draft-btn" class="btn btn-warning btn-soft btn-xs" disabled>转草稿</button>
                            <button id="batch-tag-add-btn" class="btn btn-soft btn-xs" disabled>加标签</button>
                            <button id="batch-tag-remove-btn" class="btn btn-soft btn-xs" disabled>移除标签</button>
                            <button id="batch-category-btn" class="btn btn-soft btn-xs" disabled>改分类</button>
                            <button id="batch-delete-btn" class="btn btn-error btn-soft btn-xs" disabled>删除</button>
                        </div>
                    </div>

                    <div class="filters card bg-base-100">
                        <div class="card-body p-4 flex-row flex-wrap gap-3 items-center">
                            <label class="input input-sm input-bordered flex items-center gap-2 grow min-w-48">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="size-4 opacity-60"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                                <input type="text" id="search-input" class="grow" placeholder="搜索标题、描述、标签...">
                            </label>
                            <select id="category-filter" class="select select-sm select-bordered w-44">
                                <option value="">全部分类</option>
                            </select>
                            <select id="tag-filter" class="select select-sm select-bordered w-40">
                                <option value="">全部标签</option>
                            </select>
                            <select id="draft-filter" class="select select-sm select-bordered w-32">
                                <option value="">全部状态</option>
                                <option value="false">已发布</option>
                                <option value="true">草稿</option>
                            </select>
                        </div>
                    </div>
                    <div class="article-list" id="article-list">
                        <!-- Articles will be loaded here -->
                    </div>
                    <div class="pagination" id="pagination"></div>
                </div>

                <!-- Categories View -->
                <div id="categories-view" class="view">
                    <div class="view-header">
                        <div>
                            <h2>分类管理</h2>
                            <p class="view-summary">分类对应文章目录，可以提前创建空分类</p>
                        </div>
                        <div class="actions">
                            <button id="new-category-btn" class="btn btn-primary btn-sm">
                                <svg class="size-4 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                                新建分类
                            </button>
                        </div>
                    </div>
                    <div class="filters card bg-base-100">
                        <div class="card-body p-4 flex-row gap-3 items-center">
                            <label class="input input-sm input-bordered flex items-center gap-2 grow max-w-sm">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="size-4 opacity-60"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                                <input type="text" id="category-search" class="grow" placeholder="搜索分类...">
                            </label>
                        </div>
                    </div>
                    <div class="category-list" id="category-list">
                        <!-- Categories will be loaded here -->
                    </div>
                </div>

                <!-- Tags View -->
                <div id="tags-view" class="view">
                    <div class="view-header">
                        <div>
                            <h2>标签管理</h2>
                            <p class="view-summary">标签来自文章的 tags 字段，也可以提前创建备用</p>
                        </div>
                        <div class="actions">
                            <button id="new-tag-btn" class="btn btn-primary btn-sm">
                                <svg class="size-4 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                                新建标签
                            </button>
                        </div>
                    </div>
                    <div class="filters card bg-base-100">
                        <div class="card-body p-4 flex-row gap-3 items-center">
                            <label class="input input-sm input-bordered flex items-center gap-2 grow max-w-sm">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="size-4 opacity-60"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                                <input type="text" id="tag-search" class="grow" placeholder="搜索标签...">
                            </label>
                            <select id="tag-sort" class="select select-sm select-bordered w-36">
                                <option value="count">按数量排序</option>
                                <option value="name">按名称排序</option>
                            </select>
                        </div>
                    </div>
                    <div class="tag-list" id="tag-list">
                        <!-- Tags will be loaded here -->
                    </div>
                </div>

                <!-- Backups View -->
                <div id="backups-view" class="view">
                    <div class="view-header">
                        <div>
                            <h2>备份管理</h2>
                            <p class="view-summary" id="backups-summary"></p>
                        </div>
                        <div class="actions">
                            <button id="prune-backups-btn" class="btn btn-outline btn-warning btn-sm">清理过期备份</button>
                        </div>
                    </div>
                    <div class="card bg-base-100">
                        <div class="card-body p-0">
                            <div id="backup-table-wrap" class="backup-table-wrap"></div>
                        </div>
                    </div>
                    <div class="pagination" id="backup-pagination"></div>
                </div>                <!-- Editor View -->
                <div id="editor-view" class="view editor-view">
                    <form id="article-form" class="editor-form" novalidate>
                        <div class="editor-head">
                            <h1 id="editor-title">编辑文章</h1>
                            <div class="editor-head-actions">
                                <span id="dirty-hint" class="badge badge-warning badge-soft" hidden>有未保存的更改</span>
                                <button type="button" class="btn btn-ghost btn-sm" id="cancel-edit">返回</button>
                                <button type="button" class="btn btn-outline btn-sm" id="preview-article-btn">预览</button>
                                <button type="submit" class="btn btn-primary btn-sm" id="save-article-btn">发布</button>
                            </div>
                        </div>
                        <p id="editor-path" class="editor-path"></p>

                        <input type="text" id="article-title" class="editor-title-input" placeholder="请输入文章标题…" required autocomplete="off">

                        <div class="editor-toolstrip">
                            <button type="button" class="settings-toggle" id="settings-toggle" aria-expanded="false" aria-controls="editor-meta">
                                <svg class="size-4 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
                                <span>文章设置</span>
                            </button>
                            <span class="toolstrip-hint">Ctrl+S 保存 · Esc 返回</span>
                        </div>

                        <div class="editor-meta" id="editor-meta" hidden>
                            <div class="meta-field">
                                <label for="article-category">分类</label>
                                <input type="text" id="article-category" class="input input-bordered w-full" autocomplete="off">
                                <datalist id="category-list-datalist"></datalist>
                            </div>
                            <div class="meta-field">
                                <label for="article-tags">标签（用逗号分隔）</label>
                                <input type="text" id="article-tags" class="input input-bordered w-full" list="tag-list-datalist" autocomplete="off">
                                <datalist id="tag-list-datalist"></datalist>
                            </div>
                            <div class="meta-field">
                                <label for="article-lang">语言</label>
                                <input type="text" id="article-lang" class="input input-bordered w-full" placeholder="例如：zh_CN">
                            </div>
                            <div class="meta-field">
                                <label for="article-image">封面图 URL</label>
                                <input type="text" id="article-image" class="input input-bordered w-full">
                            </div>
                            <div class="meta-field field-desc">
                                <label for="article-description">描述</label>
                                <input type="text" id="article-description" class="input input-bordered w-full">
                            </div>
                            <div class="meta-field meta-field-draft">
                                <label class="label cursor-pointer gap-3 justify-start p-0 text-sm">
                                    <input type="checkbox" id="article-draft" class="toggle toggle-sm toggle-warning">
                                    存为草稿
                                </label>
                            </div>
                            <div id="image-preview" class="image-preview" hidden>
                                <img id="image-preview-img" alt="封面图预览">
                                <p id="image-preview-error" class="image-preview-error" hidden>封面图加载失败，请检查 URL</p>
                            </div>
                        </div>

                        <div class="editor-content">
                            <div class="md-editor">
                                <div class="md-toolbar" id="md-toolbar">
                                    <button type="button" class="md-tool-btn md-tool-text" data-action="h1" title="标题 1">H1</button>
                                    <button type="button" class="md-tool-btn md-tool-text" data-action="h2" title="标题 2">H2</button>
                                    <button type="button" class="md-tool-btn md-tool-text" data-action="h3" title="标题 3">H3</button>
                                    <span class="md-tool-sep"></span>
                                    <button type="button" class="md-tool-btn" data-action="bold" title="加粗 (Ctrl+B)"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h8a4 4 0 0 1 0 8H6z"/><path d="M6 12h9a4 4 0 0 1 0 8H6z"/></svg></button>
                                    <button type="button" class="md-tool-btn" data-action="italic" title="斜体 (Ctrl+I)"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 4h-9"/><path d="M14 20H5"/><path d="M15 4 9 20"/></svg></button>
                                    <button type="button" class="md-tool-btn" data-action="strike" title="删除线"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4H9a3 3 0 0 0-2.83 4"/><path d="M14 12a4 4 0 0 1 0 8H6"/><path d="M4 12h16"/></svg></button>
                                    <button type="button" class="md-tool-btn" data-action="quote" title="引用"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 11H6a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v6a4 4 0 0 1-4 4"/><path d="M19 11h-4a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v6a4 4 0 0 1-4 4"/></svg></button>
                                    <button type="button" class="md-tool-btn" data-action="code" title="代码"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/></svg></button>
                                    <span class="md-tool-sep"></span>
                                    <button type="button" class="md-tool-btn" data-action="ul" title="无序列表"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></svg></button>
                                    <button type="button" class="md-tool-btn" data-action="ol" title="有序列表"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 6h11"/><path d="M10 12h11"/><path d="M10 18h11"/><path d="M4 6h1v4"/><path d="M4 10h2"/><path d="M6 18H4c0-1 2-2 2-3s-1-1.5-2-1"/></svg></button>
                                    <button type="button" class="md-tool-btn" data-action="table" title="表格"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M12 3v18"/><path d="M3 9h18"/><path d="M3 15h18"/></svg></button>
                                    <button type="button" class="md-tool-btn" data-action="hr" title="分隔线"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></svg></button>
                                    <span class="md-tool-sep"></span>
                                    <button type="button" class="md-tool-btn" data-action="link" title="链接 (Ctrl+K)"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></button>
                                    <button type="button" class="md-tool-btn" data-action="image" title="插入图片链接"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg></button>
                                    <button type="button" class="md-tool-btn" data-action="upload" title="上传图片（也可直接粘贴或拖入编辑器）"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg></button>
                                    <span class="md-tool-spacer"></span>
                                    <button type="button" class="md-tool-btn md-tool-preview" id="md-preview-toggle" title="显示 / 隐藏预览">隐藏预览</button>
                                    <span class="md-tool-sep"></span>
                                    <button type="button" class="md-tool-btn md-tool-zen" id="zen-toggle" title="沉浸模式">沉浸模式</button>
                                </div>
                                <input type="file" id="md-image-input" accept="image/*" multiple hidden>
                                <div class="md-editor-body">
                                    <textarea id="article-content"></textarea>
                                    <div id="md-preview" class="md-preview"></div>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </main>
        </div>
    </div>

    <!-- Article Preview Modal -->
    <div id="preview-modal" class="modal">
        <div class="modal-box preview-modal-box max-w-4xl">
            <div class="modal-header">
                <div>
                    <h2 id="preview-title">文章预览</h2>
                    <div id="preview-meta" class="preview-meta"></div>
                </div>
                <button class="btn btn-circle btn-ghost btn-sm" id="close-preview" aria-label="关闭">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="size-5"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                </button>
            </div>
            <div id="preview-content" class="md-preview preview-pane"></div>
        </div>
    </div>

    <!-- Confirm / Prompt Dialog Modal -->
    <div id="dialog-modal" class="modal">
        <div class="modal-box dialog-modal-box max-w-md">
            <h2 id="dialog-title" class="dialog-title"></h2>
            <p id="dialog-message" class="dialog-message"></p>
            <div id="dialog-fields"></div>
            <div class="dialog-actions">
                <button id="dialog-cancel" class="btn btn-ghost"></button>
                <button id="dialog-confirm" class="btn btn-primary"></button>
            </div>
            <button id="dialog-close" class="btn btn-circle btn-ghost btn-sm dialog-x" aria-label="关闭">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="size-4"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            </button>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>
